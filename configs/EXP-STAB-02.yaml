  "implementation_choices": [
    "Config path configs/EXP-STAB-02.yaml with a JSON body (STAB-01 convention); this registry module is a fifth new file next to the four the design lists; the runner, module and registry sha256 are pinned in the config registration block (code_sha256) and verified before any data is read.",
    "Config digest as A2/RS-03: sha256 of canonical JSON (sort_keys, indent 2, one trailing newline) with exactly DIGEST_NULLED_PATHS set to null; no in-config digest field; the digest, the registered commit and code_sha256 are the registration entry of the external append-only digest manifest (registration.digest_manifest_path, outside the repository), which also receives every pass receipt: one original config_digest entry, then exactly one config_digest_reregistration entry per bug_fix_retries record, in order, each reconciled with its record (retry index, previous digest = the void config digest, void registered and registration commits, aborted attempt; plus a reason and a new digest); an entry without a record or a record without an entry refuses; the last entry is the active registration, whose commit and digest are never a void one. The registered commit must contain the reviewed sources and a config with the same digest and be an ancestor of HEAD; missing Git provenance refuses.",
    "RB continuation: one rollouts() call (the registered function) over every non-terminal child of every first pitch, children ordered action, sample, outcome; continuation uniforms U[i,1:,:] of the parent sample; a cap of 1 truncates every child to the cutoff. Children with outcome probability 0 are still rolled out (weight 0).",
    "RB12 first pitch: chunks of six samples (0-5, then 6-11), action-major inside a chunk; RB6 is one chunk.",
    "A0 first-step evidence: the runtime seed-0 planner and the A0 seed-5 planner are observed during their original searches (instance-level FirstStepObserver over the same bound pool/predictor/terminal/budget and a recording q_values; registered code unchanged, no second search): the first-pitch outcome index and the value of every (action, sample) path and the planner time. The evidence must reproduce the A0 Q exactly; it is stored in the pass-M and confirmation decisions.npz and pass C reads it from pass M.",
    "Reconstruction: first the untraced comparison of the first six RB selected-outcome paths with the A0 evidence of the same seed: any first-outcome index difference is a first-pitch flip (zero allowed, stop); a path with the same first outcome and a different value is a differing path. Only then the RB search is re-run once with a tracing twin of JointSimulator.step on a scratch budget (it must reproduce the search exactly) and each differing path gets its own margin, the smallest |u - CDF| over the outcome draws of its traced continuation (inf if its first outcome ends the PA). This margin is a heuristic bound (the minimum anywhere along the differing path, not necessarily its divergence point): a margin <= 1e-5 is consistent with, not proof of, a float-rounding flip. Stop if any differing-path margin > 1e-5; at the end of the pass, stop if decisions with a differing path exceed 0.1% of the compared decisions.",
    "A0 reproduction (pass M): K1_tv and K1_top1_same from diagnose_policy_seed_ensemble.compare() must equal the STAB-01 columns exactly; the run stops as soon as mismatches exceed floor(0.001 x the STAB-01 decision count).",
    "r_b (smoke) = mean over seeds 0 and 5 of rows(RB6, seed)/rows(A0, seed) on the three smoke games, the same definition as r_rows; A0 seed-0 rows are the runtime planner rows of those decisions only.",
    "Smoke projections scale by games: BF48 pass-D time = smoke BF48 seconds x 50/3; FH-DP 10-game time = FH-DP seconds on its 1 smoke game x 10.",
    "Smoke sink: the smoke runtime is built with a MemoryLedger (same interface and hash-chained rows as policy_runtime.Ledger, kept in process memory, rows re-verified and copied on read) by resolving policy_runtime.Ledger to it only while that runtime is constructed (frozen source bytes unchanged). The runner is a synchronous single-process, single-threaded CLI: the substitution refuses when another Python thread is alive or a substitution is already active and restores the file ledger on any exit, so every runtime built outside that block (passes M and confirmation) keeps the file ledger. The A0 Q and laws are never written to disk; results.json passes an allowlist of cost/structure/identity fields with no metric-like key and no float vector, else the write is refused. An unsuccessful smoke (structural failure or r_b > 4.0) keeps that evidence, writes the stop record aborted.json and exits 3 at once.",
    "Deadline: the code does not know WS game days, so it treats every day as a game day: a pass may start only outside 06:00-13:30 KST and only if start + cap <= the next 06:00 KST; its deadline is min(next 06:00 KST, start + cap). A pass that does not fit is deferred: receipt DEFERRED, lock released, exit code 4.",
    "A pass clock starts before its data preparation. started.json, preparation, the pass (with its compressed arrays), results.json and SHA256SUMS all run under the deadline/cap/RSS watch and the abort handler; the deadline and the cap are checked before every PA block and the peak RSS every 10 PA blocks; the final deadline/cap/RSS check follows the last write of the pass folder and only then is the terminal receipt (COMPLETED, the completion marker) appended; it carries the post-sealing measurements (seconds_total, utc, process peak RSS), while the fields kept in results.json are labelled pre-sealing. Both abort paths remove unfinished runner-owned JSON staging files (*.tmp) and partial arrays before sealing; sealing refuses a folder that still holds one. The confirmation selection is staged, hashed and checked, then published by rename and its SELECTED receipt; publication means file plus matching SELECTED receipt (also in the digest manifest), an unreceipted leftover is recovered (removed and recorded), and the confirmation verifies the publication against its pin. Pass-D arms (BF48, FH-DP 7,200 s) each have their own watch.",
    "Heavy lock held by another job: nothing starts, no pass folder is written, a LOCK_HELD receipt is appended and the process exits 3 (the pass is not marked aborted, so a later window can start it).",
    "Passes C and D re-create the pass-M decisions without the runtime planner (requests rebuilt from the store, kept by the pass-M request_id sequence, masked reference recomputed and compared with the stored mask and reference, components.check_context/check_support per request); the runtime seed-0 and A0 seed-5 Q and their first-step evidence come from the sha-verified pass-M arrays (no planner search is repeated).",
    "Exit codes: 0 done or nothing left, 2 refused (gate, config, provenance, path, memory), 3 stopped (an abort, an unsuccessful smoke, lock held, failed verification), 4 deferred to the next window.",
    "Variances (VRF, RB residual, mc_se) use ddof=1 over the samples; the efficiency interval bootstraps the VRF numerator/denominator sums and the per-seed row sums on the same game draws.",
    "Truncation share: A0 = truncated rollouts / rollouts; RB = probability-weighted truncated children / first-pitch samples (the expected A0 share).",
    "FH-DP: no registered row budget; its RowBudget limit is sys.maxsize and the 7,200 s cap bounds it; the predictor is called once per decision for all nodes (root 400 draws, other nodes indices 0,10,...,390); unreachable counts reuse the root law and BC rows (they never feed reachable values).",
    "FH-DP comparison: for RB pairs (0,5), (0,100), (5,100) the per-decision difference agreement(DP, RB_s) - agreement(RB_t, RB_s) and the same for TV are reported with intervals (descriptive).",
    "The final verdict is written once to <attempt>/verdict.json, recomputed from the verified smoke/M/C records; on every resume and before any confirmation it is recomputed again and must equal verdict.json and the digest of its VERDICT receipt; results/EXP-STAB-02.json is not written by the runner (the PM copies a verified result).",
    "A pass folder counts as complete or aborted only through its terminal receipt (the last COMPLETED/ABORTED line of the same attempt, pass and SHA256SUMS file, with this config digest, present identically in the external digest manifest) whose digest equals the verified SHA256SUMS digest; this is checked on every resume and before any dependent pass. A folder without a terminal receipt (interrupted at any point, even before its started.json) is closed as an abort with the pass effect; its retry window is its recorded start window or, if that is missing, conservatively the current one. A process in which any stop rule fired (pass C or a pass-D arm aborted while later passes ran) exits 3.",
    "Confirmation: --confirmation-select records the 50-game list (no planning call) under the same window/watch check as a pass; --confirmation runs against a pin file whose games sha256 must equal it (Song's go is the PM gate before writing that pin). Retries go to <attempt>/confirmation/try-NN; a try after an aborted one starts only in a later run window (window id = the 06:00 KST that closes the window); a completed try is final.",
    "Resources: A0 seed-0 planner time is measured inside runtime.submit (recording q_values) and reported next to the whole submit time; other arms time q_values; pass seconds include data preparation; peak RSS is ru_maxrss, a process-lifetime peak (bytes on macOS), conservative against the 8 GiB cap and labelled as such.",
    "Smoke status counts: statuses.* and fhdp_only_game_statuses.* may carry exactly the runtime decision statuses (policy_runtime.STATUSES, e.g. UNSUPPORTED_LOGGING_POSITIVITY) with non-negative integer counts; they are structural counts, exempt from the metric-like key scan, while every other key and every float vector is still refused.",
    "macOS AppleDouble sidecars (the ._ prefix and AppleDouble magic, matrix_policy_artifacts.is_appledouble), which non-APFS volumes such as the T7 drive create beside every written file, even after sealing, are operating-system metadata: SHA256SUMS sealing and verification ignore them; every seal is verified at once.",
    "One data scope per process: smoke (3 smoke games + the FH-DP smoke game), registered (the 150 games; smoke, M, C, D) or confirmation (50 games); the processed sha, statcast 2023-2025 sources, style snapshot, G0 bundle, tau freeze and the S2 bind identity 5683fb61 are checked before any planning call in every scope."
  ],
