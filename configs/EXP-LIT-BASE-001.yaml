decision:
  primary: dNLL = NLL(R) - NLL(B*) on E_PS, both with q floor 0.001 (E.floor), game_pk paired bootstrap 2000, seed 20261110
  best_baseline_rule: >-
    B* = enabled family 중 DEV NLL(선정 설정, 신경망은 3 seed 평균, DEV에서 맞춘 tau 적용)이 가장 낮은 것. select 단계가 E_PS 채점 전에
    best.json으로 고정한다. E_PS 결과로 B*를 바꾸지 않는다.
  verdicts:
    r_better: R이 낫다                 # 95% 상한 < 0
    no_difference: 차이 감지 안 됨      # 구간이 0을 포함
    baseline_better: 기준 모델이 낫다    # 95% 하한 > 0 (불리한 결과도 그대로 보고)
  secondary: [각 기준 모델 vs R ΔNLL·ΔBrier·ΔECE10·Δtop1, top1, top3, ECE10(top-label), 구종별 ECE 평균, tau=1 판(보정 없음), 각 기준 vs C·vs 9월 빈도표]
  wording: 재구현 비교(같은 자료의 문헌식 모델)이지 논문 재현이 아니다. 정책 개선 주장 없음.

