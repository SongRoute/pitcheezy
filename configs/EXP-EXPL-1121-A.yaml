limitations:
  - E_PS는 이미 여러 번 봤고(R 채택, LIT-BASE 채점), EXPL-FINAL에서 다시 쓴다. 독립 시험이 아니다.
  - DEV(9월)는 LIT-BASE에서 이미 수치를 본 자료이고, 이번 팔 설계(상한 늘리기 등)는 그 DEV 결과를 보고 정했다. DEV 순위는 낙관적일 수 있다.
  - tau와 κ는 DEV에서 맞추고 DEV로 선정에 쓴다(모수 1개씩).
  - 서버(CUDA)와 맥은 비트 재현이 보장되지 않는다. E_PS 예측(EXPL-FINAL)은 서버 가중치를 맥 CPU에서 돌린다.
