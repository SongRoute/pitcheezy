limitations:
  - E_PS는 이미 여러 번 본 자료이고, R은 E_PS 비교(R−C)로 채택됐다. 이 비교도 같은 E_PS를 다시 쓰므로 독립 시험이 아니다.
  - 문헌식 재구현(같은 자료·같은 정보 집합)이지 논문 재현이 아니다. 논문 보고값과 나란히 순위를 매기지 않는다.
  - R은 15성분 앙상블 + 7–8월 OOF로 맞춘 tau/w 혼합이고, 기준 모델은 단일 모형(신경망은 3 seed 평균) + DEV tau다.
  - 기준 모델 초매개변수 예산은 위 목록이 전부다. 더 넓은 탐색에서 더 좋아질 수 있다.
  - DEV(9월)는 tune 학습 창 바로 뒤라 E_PS(10월 포스트시즌)와 분포가 다르다.
  - tau는 DEV에서 맞추고 DEV로 선정에 쓴다(모수 1개, 모든 기준 모델 같은 처리).
