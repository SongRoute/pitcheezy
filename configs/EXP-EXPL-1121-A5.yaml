limitations:
  - budget 24·30은 A3·A4·A4b DEV 묶음 결과(budget이 길수록 묶음 DEV가 낮음)를 본 뒤 정했다. 같은 DEV를 다시 쓴다.
  - budget과 seed가 섞여 있던 관찰(12/16/19는 서로 다른 seed의 조기 종료 값)이라 원인이 budget이 아닐 수 있다. 이 묶음은 seed를 A3-seeds와 같게 두어 짝 비교로 확인한다.
  - 단일 모델 최저는 19 근처라 24·30에서 각 모델은 DEV에 과적합될 수 있다. tau가 일부 보정한다.
  - fixed_budget은 tune에 새로 넣은 선택 항목(코드 몇 줄)이다. 이 키가 없는 기존 팔의 동작은 그대로다.
  - E_PS는 FINAL v3에서 채점되고, v4는 재열람(탐색)이다.
  - 서버(CUDA)와 맥은 비트 재현이 보장되지 않는다.
