decision:
  provisional_rule: >-
    이 묶음 안 순위 = DEV NLL(선정 설정, seed 묶음 평균, DEV tau)이 낮은 순. select는 provisional-best.json(묶음 안 1위)만 쓴다.
  final_rule: >-
    팔을 나눠 등록해도 최종 선택은 전체 후보 집합(EXPL-A ∪ EXPL-B의 모든 팔 + LIT-BASE B-SEQ)에서 DEV로만 한다.
    EXPL-FINAL 등록(EXPL-B 확정 뒤, 또는 B 취소 시 A만으로)이 select·predict·score를 맡고, E_PS는 최종 후보 확인용으로 1회만 쓴다.
    비교: R − B*_new, B*_new − B-SEQ, B*_new − C, 각 top1 변화를 따로.
  booth: 부스 모델 선택은 PM·owner 결정(후보 R, B-SEQ, B*_new).

