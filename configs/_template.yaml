# 실험 설정 템플릿.
# 복사해서 configs/{ID}.yaml 로 저장. 파일명 = id. 한 ID = 베이스라인 대비 변경 하나.
# 실험은 configs/ 파일로만 정의한다. 코드에 파라미터를 하드코딩하지 않는다.

id: EXP-P0-000                   # EXP-P{phase}-{seq}. 000은 템플릿용 자리값
phase: 0
baseline: null                   # 비교 대상 실험 ID (베이스라인 자체면 null)
change: ""                       # 베이스라인 대비 변경 한 줄
data_version: d20260911-s2325    # data/versions.md 의 버전 ID
seeds: [0, 1, 2]                 # 탐색 {0,1,2} / 채택 판정 {0,1,2,3,4}
wandb:
  project: pitcheezy             # run 이름 {id}/s{seed}
params: {}                       # 모듈별 하이퍼파라미터
# params.state 의 선택 키 (자세한 값은 실제 실험 config 참고):
#   state:
#     K: 1
#     collapse_base_out: false
#     context: {kind: prev_pitch_family, C: 4}   # 시퀀스 맥락 v0 = 직전 구 구종 계열. 없으면 C=1 (맥락 없음)
