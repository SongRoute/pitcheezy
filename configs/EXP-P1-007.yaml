# EXP-P1-007 — B2 절제 ⓐ: 현재 투구의 연속 물리 피처 제거. 006 과 나머지 하이퍼파라미터·데이터 동일.
# 목적: 006 의 NLL 우위(1.060 vs 우리 1.176~1.210)가 "시퀀스 맥락" 때문인지 "현재 투구의 연속 물리 피처" 때문인지 가른다.
# 이 설정에서 B2 가 현재 투구에 대해 아는 것은 우리 전이 모델과 같다 (구종 9 × 위치 셀 25). 창·맥락 16 은 그대로.
id: EXP-P1-007
phase: 1
baseline: EXP-P1-006
change: "B2 에서 현재 투구의 연속 물리 피처 제거(구종·위치 셀만) — 시퀀스 맥락 효과 분리"
data_version: d20260911-s2325
pool_version: pool-ip100-2023_2025-d20260911-s2325-2b19cc1
re24_version: re24-2023_2025-d20260911-s2325-82b008b
seeds: [0, 1, 2]                 # 신경망 학습에 난수 있음
wandb:
  project: pitcheezy
  mode: online
params:
  train_seasons: [2023, 2024]    # 2026 은 어디에도 쓰지 않는다 (OPE 전용, 이 실험엔 OPE 없음)
  eval_season: 2025
  ref_experiment: EXP-P0-006     # common_rows 를 정의하는 우리 전이 모델 (holdout 텐서의 valid·P)
  b2:
    d_model: 256                 # 논문: 임베딩 256
    n_heads: 4
    ff: 512
    n_layers: 2
    dropout: 0.1
    window: 6                    # 같은 타석 직전 6구
    dense_pitch: 64              # 현재 투구 블록 + 구종·위치 임베딩 차원
    dense_ctx: 32                # 맥락 블록
    dense_head: 64               # 결합 후 dense
    lr: 0.0001
    batch_size: 512
    max_epochs: 200              # 조기 종료(2025 홀드아웃 NLL, patience 10)로 실제 에폭 결정
    patience: 10
    eval_subset: 0               # > 0 이면 조기 종료 판정만 이 행 수의 고정 부분집합에서. 최종 지표는 항상 전체
    device: auto                 # mps 있으면 mps
    current_phys: false          # 절제: 현재 투구 블록 = 구종 임베딩 + 위치 셀 임베딩만
    use_window: true             # 6구 시퀀스 인코더는 그대로
