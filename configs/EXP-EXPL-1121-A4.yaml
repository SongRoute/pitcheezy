limitations:
  - A·A2·A3·B의 DEV 결과를 보고 정한 설정이고 같은 DEV를 다시 쓴다. DEV 순위가 더 낙관적일 수 있다.
  - A4-seeds의 budget은 seed 30의 DEV 조기 종료 epoch이다. seed 30의 tune 예측은 DEV로 멈춘 값이다(A2a·A3와 같은 규칙).
  - A4-cal 설정 0과 1은 seed·lr이 같아 patience 3에서 멈추기 전까지 궤적이 같다. 따라서 설정 1의 DEV NLL이 설정 0 이하인 것은 구조상 당연하고, "더 긴 학습 뒤 더 낮은 최저점이 있는가"만 알려준다.
  - A4-cal의 DEV 값은 설정 3개 중 최저 + DEV 조기 종료라 묶음 팔보다 DEV 낙관이 크다. 설정 2(lr 1e-3)가 상한(40 epoch)에 닿으면 "상한 도달, 미수렴"으로만 보고한다.
  - A4-cal은 seed 1개라 묶음 효과가 없다. 단일 성분으로는 묶음 팔보다 DEV가 나쁠 것으로 보이며, 조기 종료 변형의 효과를 보는 탐침이다. seed 1개의 설정 차이는 seed 잡음과 구분하기 어렵다.
  - tau는 기존 코드대로 각 팔에서 DEV로 맞춘다(tau 변형은 기존 코드로 할 수 없어 넣지 않았다).
  - E_PS는 이미 여러 번 봤고 FINAL v3에서 다시 채점한다. A4가 들어가는 FINAL v4의 E_PS 채점은 재열람이다(탐색).
  - 서버(CUDA)와 맥은 비트 재현이 보장되지 않는다.
