decision:
  provisional_rule: >-
    이 묶음 안 순위 = DEV NLL(선정 설정, seed 묶음 평균, DEV tau)이 낮은 순. select는 provisional-best.json(묶음 안 1위)만 쓴다.
  final_rule: >-
    팔을 나눠 등록해도 최종 선택은 전체 후보 집합에서 DEV로만 한다. 정적 모델 B*_static = 풀(EXPL-A 4팔 ∪ X-DATA ∪ LIT-BASE B-SEQ) 중
    DEV NLL(seed 묶음 평균, DEV tau) 최소. X-PREQ(경기 뒤 갱신 모드, data-roles.md:21에 따라 정적 팔과 같은 순위에 섞지 않음)는
    B*_static 위에 얹은 판으로 따로 고정·보고한다(κ ∞가 격자에 있어 DEV에서 구조상 바탕 이하이므로 순위 비교 대상이 아님).
    EXPL-FINAL 등록이 select·predict·score를 맡고 E_PS는 1회. 비교: R − B*_static, B*_static − B-SEQ, B*_static − C,
    X-PREQ − B*_static, R − X-PREQ, X-PREQ − B-SEQ, 각 top1 변화를 따로. 풀 팔이 실패·취소되면 PM 결정으로 등록을 고치고 재검토한다.
  booth: 부스 모델 선택은 PM·owner 결정(후보 R, B-SEQ, B*_new).

