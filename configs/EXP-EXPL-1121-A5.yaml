    최종 선택은 전체 후보 집합에서 DEV로만 한다. 이 묶음 두 팔 중 selection.json dev_nll_ensemble_tau가 낮은 한 팔만 EXPL-FINAL v4 풀에 들어간다(동률 1e-6이면 b24). 선택된 팔은 A3-seeds보다 DEV가 나빠도 넣는다.
    이 규칙은 FINAL v3의 E_PS 열람 전(커밋 78d0be41)에 고정했다.
    한 팔만 DONE이면 그 팔이 들어간다. 다른 팔은 서술용. 짝 비교(같은 seed 10..29의 A3-seeds budget 19)는 보고용.
    E_PS는 FINAL에서만.
