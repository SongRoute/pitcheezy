# EXP-P0-001 — 우리 모델 베이스라인 (Phase 0). docs/experiments.md 행과 짝.
id: EXP-P0-001
phase: 0
baseline: null
change: "우리 모델: 카운트×주자아웃×군집(K=1), 투수별 ⓐ 집계+계층 평활, −dRE24 보상 VI, softmax 평가"
data_version: d20260911-s2325
pool_version: pool-ip100-2023_2025-d20260911-s2325-2b19cc1
re24_version: re24-2023_2025-d20260911-s2325-82b008b
seeds: [0, 1, 2]                 # 집계 모델은 난수 없음 → 시드는 OPE 부트스트랩에만
wandb:
  project: pitcheezy
  mode: online
params:
  state:
    K: 1                         # 타자 군집 없음 (v0). 군집은 별도 실험으로
    collapse_base_out: false
  transition:
    train_seasons: [2023, 2024, 2025]
    holdout: {train_seasons: [2023, 2024], eval_season: 2025}
    alpha: auto                  # 계층 디리클레 평활 강도. auto = alpha_grid 를 2025 홀드아웃 NLL 로 스크리닝 (D16)
    alpha_grid: [5, 10, 20, 50, 100, 200, 500]
    repertoire_min_pitches: 100
  policy:
    kind: softmax                # softmax | topk | greedy | uniform | behavior
    temperature: 0.02            # 잠정 (D17). 단위 RE24. 첫 실행에서 Q 폭(max−mean 중앙값 0.07)에 맞춤. 메뉴는 ope.menu
    top_k: 5
  ope:
    eval_season: 2026
    behavior_alpha: 20           # π_b 계층 평활 (D18)
    n_folds: 5                   # π_b 경기 단위 교차 적합 (D18). 같은 데이터로 맞추면 가중치 평균이 0.05 로 붕괴했음
    clip: 20                     # 투구 단위 비 상한. 주 추정량 = SNIPS + clip + 지지 밖 타석 제외 (D19). noclip·passthrough 도 기록
    n_boot: 1000
    menu: [primary, behavior, uniform, greedy, topk3, topk5, topk10, softmax_t0.005, softmax_t0.01, softmax_t0.02, softmax_t0.05, softmax_t0.1]  # 모든 실험 공통 진단 메뉴
