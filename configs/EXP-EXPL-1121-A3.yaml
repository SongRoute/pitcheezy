limitations:
  - A·A2·B의 DEV 결과를 보고 정한 설정(A2a 1위 그대로)이고 같은 DEV를 다시 쓴다. DEV 순위가 더 낙관적일 수 있다.
  - A3-seeds의 budget은 seed 10의 DEV 조기 종료 epoch이다(A2a는 seed 0에서 16). 같은 설정이어도 budget이 다를 수 있고, seed 10의 tune 예측은 DEV로 멈춘 값이다(A2a와 같은 규칙).
  - A2a+A3-seeds 30 seed 묶음은 FINAL 조합(AM-eq 등)으로만 생기며, 두 팔의 tau가 따로 맞춰진 뒤 합쳐진다(단순 30 seed 평균과 다름).
  - A3-plus의 2023~2025 자료는 X-DATA와 같은 한계(시즌 간 구종 분류·기량 변화 미측정, 시즌 구분 입력 없음). X-DATA(B-SEQ형 설정, seed 3)는 DEV에서 B-SEQ보다 나빴다.
  - E_PS는 이미 여러 번 봤고(R 채택, LIT-BASE 채점), EXPL-FINAL에서 다시 쓴다. 독립 시험이 아니다.
  - tau는 DEV에서 맞추고 DEV로 선정에 쓴다(모수 1개).
  - 서버(CUDA)와 맥은 비트 재현이 보장되지 않는다. E_PS 예측(EXPL-FINAL)은 서버 가중치를 맥 CPU에서 돌린다.
