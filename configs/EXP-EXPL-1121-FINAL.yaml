  - E_PS는 이미 여러 번 봤다(R 채택, LIT-BASE 채점, EXP-PREQ-001, FINAL v3). v4 채점은 이 계열 안 재열람이며 탐색으로만 보고한다. 독립 시험이 아니다.
  - DEV는 LIT-BASE에서 본 자료이고 팔 설계(A2·A3 포함)가 그 결과를 보고 정해졌다. A3는 A·A2·B DEV를 본 뒤 정했다. 조합 후보가 32,276개(v3 15,438개, v2 8,666개)라 DEV 1위는 운으로 1위일 수 있다.
  - 조합 탐색은 크기 ≤ 4 + 전체 집합으로 줄였다(CANDIDATES의 6개 전수와 다름).
  - D6(B-*)의 E_PS 예측은 가중치 없는 LIT final 예측이다. 서비스 연결에는 EXP-SVC-PRED-001 재학습이 필요하다.
  - E_PS 예측은 서버 CUDA 가중치를 맥 CPU에서 돌린다(비트 재현 보장 없음).
  - X-PREQ의 DEV와 E_PS 갱신 조건이 다르다(m 기간, c 표본 크기).
