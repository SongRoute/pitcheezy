decision:
  final_rule: >-
    후보 = 성분 18개(D6 + X-GRU-A, X-GRU-B, X-TAK, X-GBT, X-GRU-A2a, X-GRU-A2b, X-DATA, X-GRU-A3-seeds, X-GRU-A3-plus, X-GRU-A4-seeds, X-GRU-A4b-seeds, X-GRU-A5-b24)의 단일·조합(AM-eq/GM-eq/AM-w/GM-w × 온도 없음/T).
    점수 = DEV 교차적합 NLL(하한 0.001). 1순위 = 최저와 0.0005 이내 중 성분 수 적음 → 동일 가중 → 온도 없음 순(CANDIDATES-1121과 같음).
    가중치·T는 DEV 전체로 다시 맞춰 E_PS에 쓴다. 기준 후보 = 기존 조합 1순위 C+SEQ+GBT GM-w(같은 후보 집합 안에 있고, 따로 대비 보고).
    select가 E_PS를 읽기 전에 best.json으로 고정(덮어쓰기 금지). U1은 1순위 위에 따로(정적 순위 밖). E_PS 재열람 채점은 v4_rule 조건일 때만 1회(확인 아님).
  v4_rule: >-
    (v3 E_PS 결과를 보기 전에 고정, REVIEW-EXPL-A4-FABLE 필수 2·3) 실행 조건: A4-seeds·A4b-seeds tune·fitw DONE + T7 회수(마감 2026-11-23 12:00 KST)면 v3 결과와 상관없이 select를 돌린다.
    v4 1순위가 v3 1순위와 같으면 v4는 E_PS를 채점하지 않는다. 다르면 v4 1순위 DEV 교차적합 NLL이 v3 1순위보다 0.0005(tie)를 넘게 낮을 때만
    v4 1순위가 부스 후보가 되고 E_PS 재열람 채점 1회를 한다. 아니면 v3 1순위 유지, v4 E_PS 미채점. v3·v4 사이 선택에 E_PS 수치를 쓰지 않는다.
    A4b 처리(결과 보기 전 고정): (a) 마감 안 A4-seeds·A4b 둘 다 DONE → 17성분·25,610개. (b) A4b만 미완료 → A4b를 뺀 16성분·20,040개.
    (c) A4-seeds만 미완료 → A4-seeds를 뺀 16성분(v3 + A4b). (d) 둘 다 미완료 → v4를 돌리지 않는다. DONE인 팔은 DEV 값과 무관하게 반드시 포함한다(본 뒤 빼기 금지).
    빠지는 판은 해당 pool 항목만 지운 config로 재검토 뒤 실행한다.
    A5(두 팔 b24·b30, 78d0be41에서 v3 E_PS 열람 전 고정): 마감 안 DONE인 팔 중 selection.json dev_nll_ensemble_tau가 낮은 한 팔만 넣는다(동률 1e-6이면 b24).
    선택된 팔은 A3-seeds보다 DEV가 나빠도 넣는다. 둘 다 미완료면 A5 항목을 지운다(빈 families는 members()가 거부). 넣으면 성분 18개·후보 32,276개.
    v3 판정 문구는 v4로 바뀌지 않는다. v4 score는 v3 score/result.json이 먼저 있어야 한다(prior_view 게이트, v4 등록 때 코드로 추가).
  verdicts:
    R_minus_best: {upper_lt_0: '탐색(재열람): R이 낫다', lower_gt_0: '탐색(재열람): 새 후보가 낫다', else: '탐색(재열람): 차이 감지 안 됨'}
    best_minus_BSEQ: {upper_lt_0: '탐색(재열람): 새 후보가 B-SEQ보다 낫다', lower_gt_0: '탐색(재열람): B-SEQ가 낫다', else: '탐색(재열람): 차이 감지 안 됨'}
    best_minus_reference: {upper_lt_0: '탐색(재열람): 새 1순위가 기존 GM-w보다 낫다', lower_gt_0: '탐색(재열람): 기존 GM-w가 낫다', else: '탐색(재열람): 차이 감지 안 됨'}
  report: [R − 1순위, 1순위 − B-SEQ, 1순위 − C, 1순위 − 기존 GM-w, U1 − 1순위, R − U1, U1 − B-SEQ, 각 top1 변화 따로, top3, ECE]
