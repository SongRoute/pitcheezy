[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitcheezy"
description = "MLB Statcast 투구 추천 + 4자 책임 분해"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "numpy",
  "pandas>=2.2",
  "pyarrow>=14",  # concat_tables(promote_options=) — data/statcast_fetch.py
  "pyyaml",
  "pybaseball==2.2.7",  # data/statcast_fetch.py 가 이 버전의 내부 동작(requests.get 경로, 날짜 창)에 의존. 장부에 버전 기록
  "wandb",
  "torch>=2.4",  # transition/neural.py (전이 모델 ⓑ, D24). 맥미니는 MPS
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pitcheezy.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
